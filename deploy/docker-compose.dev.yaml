services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wardrobe
      POSTGRES_USER: wardrobe
      POSTGRES_PASSWORD: wardrobe_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: server
    environment:
      DATABASE_URL: postgres://wardrobe:wardrobe_dev@postgres:5432/wardrobe?sslmode=disable
      HTTP_ADDR: :8080
      PUBLIC_BASE_URL: http://localhost:8080
      PHOTO_STORAGE_DIR: /photos
      SESSION_COOKIE_SECURE: "false"
      SESSION_TTL: 24h
      INVITATION_DEFAULT_TTL: 168h
      MAX_UPLOAD_BYTES: 12582912
      LOG_LEVEL: debug
    ports:
      - "8080:8080"
    volumes:
      - photo-storage:/photos
    depends_on:
      postgres:
        condition: service_started

volumes:
  postgres-data:
  photo-storage:
