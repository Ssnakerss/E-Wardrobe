# sqlc configuration for Wardrobe backend
version: "2"

sql:
  - engine: "postgresql"
    schema: "../../migrations"
    queries: "queries"
    gen:
      go:
        package: "sqlc"
        out: "../internal/platform/database/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type: "uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "int8"
            go_type: "int64"
          - db_type: "int2"
            go_type: "int16"
          - db_type: "bool"
            go_type: "bool"
          - db_type: "jsonb"
            go_type: "map[string]any"
